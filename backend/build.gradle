plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.parkeasy'
version = '0.0.1-SNAPSHOT'
description = 'ParkEasyBackend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
	integrationTest {
		java.srcDir file('src/integrationTest/java')
		compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
		runtimeClasspath += output + compileClasspath
	}
	liveApiTest {
		java.srcDir file('src/liveApiTest/java')
		resources.srcDir file('src/liveApiTest/resources')
		compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
	liveApiTestImplementation.extendsFrom testImplementation
	liveApiTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	integrationTestRuntimeOnly 'com.h2database:h2'
}

tasks.register('integrationTest', Test) {
	description = 'Runs isolated H2 integration tests; the read-only MySQL connection test is opt-in.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

tasks.named('processIntegrationTestResources') {
	from('src/test/resources/fixtures') { into 'fixtures' }
}

tasks.register('liveApiTest', Test) {
	description = 'Runs the opt-in, one-page public parking API smoke test.'
	group = 'verification'
	testClassesDirs = sourceSets.liveApiTest.output.classesDirs
	classpath = sourceSets.liveApiTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}
