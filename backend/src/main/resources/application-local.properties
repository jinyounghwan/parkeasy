parkeasy.public-data.full-sync.operation.trailing-empty-page-threshold=10
parkeasy.public-data.full-sync.realtime.num-of-rows=1000
parkeasy.public-data.full-sync.realtime.page-delay-ms=1000
parkeasy.public-data.full-sync.realtime.auto-resume-enabled=true
