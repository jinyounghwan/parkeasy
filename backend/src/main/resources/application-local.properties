spring.datasource.url=jdbc:mysql://localhost:3306/parkeasy
spring.datasource.username=parkeasy
spring.datasource.password=${PARKEASY_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
parkeasy.cors.allowed-origins=${PARKEASY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
parkeasy.public-data.service-key=${PARKEASY_PUBLIC_DATA_SERVICE_KEY:}
parkeasy.public-data.parking-facility-url=http://apis.data.go.kr/B553881/Parking/PrkSttusInfo
