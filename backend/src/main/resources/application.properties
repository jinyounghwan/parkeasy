spring.application.name=ParkEasy
# Admin routes are opt-in for isolated maintenance; never registered in the prod profile.
parkeasy.admin.enabled=false
parkeasy.cors.allowed-origins=${PARKEASY_CORS_ALLOWED_ORIGINS:}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.mvc.log-request-details=false
parkeasy.public-data.retry-backoff-ms=2000
parkeasy.public-data.full-sync.facility.num-of-rows=1000
parkeasy.public-data.full-sync.facility.page-delay-ms=1000
parkeasy.public-data.full-sync.facility.auto-resume-enabled=true
parkeasy.public-data.full-sync.facility.auto-resume-delay-ms=60000
parkeasy.public-data.full-sync.facility.max-auto-resume-attempts=5
parkeasy.public-data.full-sync.facility.empty-page-skip-threshold=3
parkeasy.public-data.full-sync.facility.trailing-empty-page-threshold=10
parkeasy.public-data.full-sync.operation.num-of-rows=1000
parkeasy.public-data.full-sync.operation.page-delay-ms=1000
parkeasy.public-data.full-sync.operation.auto-resume-enabled=true
parkeasy.public-data.full-sync.operation.auto-resume-delay-ms=60000
parkeasy.public-data.full-sync.operation.max-auto-resume-attempts=5
parkeasy.public-data.full-sync.operation.empty-page-skip-threshold=3
parkeasy.public-data.full-sync.operation.trailing-empty-page-threshold=10
parkeasy.public-data.full-sync.realtime.num-of-rows=1000
parkeasy.public-data.full-sync.realtime.page-delay-ms=1000
parkeasy.public-data.full-sync.realtime.auto-resume-enabled=true
parkeasy.public-data.full-sync.realtime.auto-resume-delay-ms=60000
parkeasy.public-data.full-sync.realtime.max-auto-resume-attempts=5
parkeasy.public-data.full-sync.realtime.empty-page-skip-threshold=3
parkeasy.public-data.full-sync.realtime.trailing-empty-page-threshold=10
parkeasy.sync.facility.enabled=false
parkeasy.sync.facility.cron=0 0 3 * * *
parkeasy.sync.facility.max-pages=1
parkeasy.sync.facility.sido=서울특별시
parkeasy.sync.facility.sigungu=강북구
parkeasy.sync.operation.enabled=false
parkeasy.sync.operation.cron=0 30 3 * * *
parkeasy.sync.operation.max-pages=1
parkeasy.sync.realtime.enabled=false
parkeasy.sync.realtime.fixed-delay=600000
parkeasy.sync.realtime.initial-delay=600000
parkeasy.sync.realtime.max-pages=1
parkeasy.sync.realtime.stale-after-minutes=30
