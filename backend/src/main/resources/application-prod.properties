# Supply production credentials through the environment; never use local credentials as defaults.
spring.datasource.url=${PARKEASY_DB_URL}
spring.datasource.username=${PARKEASY_DB_USERNAME}
spring.datasource.password=${PARKEASY_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Migrations are an explicit deployment step, not a read-serving application startup action.
spring.flyway.enabled=false
parkeasy.public-data.service-key=${PARKEASY_PUBLIC_DATA_SERVICE_KEY:}
parkeasy.cors.allowed-origins=${PARKEASY_CORS_ALLOWED_ORIGINS:}
parkeasy.admin.enabled=false
parkeasy.sync.facility.enabled=false
parkeasy.sync.operation.enabled=false
parkeasy.sync.realtime.enabled=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.web.client=INFO
